name: Collect theses

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write
  pages: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect thesis metadata
        run: python collector/collect.py
      - name: Save results
        run: |
          git config user.name "thesis-collector"
          git config user.email "actions@users.noreply.github.com"
          git add atlas/theses.json
          git diff --staged --quiet || git commit -m "Update thesis index"
          git push
      - name: Refresh the website
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
